<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="description" content="Soluvia — Plataforma completa para gestão de riscos psicossociais e conformidade com a NR1." />

    <!-- CSP servida pelo PRÓPRIO documento.
         Antes ela vinha do Caddy, que servia o SPA no Railway. No App Platform o
         front é um static site em CDN, e static site na DigitalOcean não permite
         cabeçalho de resposta customizado — então a política mora aqui.

         Ela existe sobretudo p/ manter a promessa de anonimato do canal de relato
         (/c/:tenant/:canal) e do verificador público (/verificar/:token): nenhum
         recurso de terceiro pode ser buscado pelo navegador do visitante.
           font-src 'self'  → trava a regressão "voltaram as fontes do Google".
           style-src        → sem CSS externo; 'unsafe-inline' é obrigatório porque
                              o app estiliza quase tudo por style={{…}} (atributo
                              inline) — tirar isso apagaria o layout.
           connect-src 'self' → o front chama /api/v1 na própria origem (a rota do
                              App Platform repassa p/ o backend); nada sai daqui.
           data:/blob:      → PDFs (pdf.js desenha em canvas, fontes embutidas do
                              PDF e download via URL.createObjectURL).

         `frame-ancestors` NÃO está aqui de propósito: o navegador IGNORA essa
         diretiva quando a CSP vem por <meta> (só vale em cabeçalho HTTP). Se um
         dia for preciso bloquear iframe, o caminho é voltar a servir o SPA por um
         componente de serviço. Hoje o risco é baixo: o token de acesso vive só em
         memória e o cookie de refresh é SameSite=lax, então uma sessão logada não
         se materializa dentro de um iframe de outro site. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; manifest-src 'self'" />

    <!-- O denunciante não deve vazar a URL do canal (que contém o tenant) ao
         clicar num link externo — 'no-referrer' é o único que não manda nem a
         origem. Equivale ao Referrer-Policy que o Caddy enviava. -->
    <meta name="referrer" content="no-referrer" />

    <!-- Sem fontes de CDN: a Poppins é auto-hospedada via @fontsource e importada
         em src/main.tsx. Não reintroduza <link>/preconnect p/ CDN de fontes
         (Google Fonts & cia.) — vazaria IP e User-Agent do visitante, inclusive o
         do denunciante anônimo em /c/:tenant/:canal, p/ um terceiro. A CSP acima
         bloqueia isso em produção.
         (Nomes de domínio ficam fora deste comentário de propósito: o build é
          auditado com grep por eles no dist/.) -->
    <title>Soluvia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
