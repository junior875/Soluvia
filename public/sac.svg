<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1053 700" width="1053" height="700" role="img" aria-label="SAC — Atendimento ao Consumidor">
  <!-- Logotipo do módulo SAC (pt-BR). Mesma gramática visual do Canal de
       Denúncias: anel laranja + meia-lua prateada, glifo navy no miolo e o nome
       POR EXTENSO em duas linhas. Variantes en/es em sac-en.svg / sac-es.svg. -->
  <defs>
    <linearGradient id="sacRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7a83c" />
      <stop offset="1" stop-color="#e07c0b" />
    </linearGradient>
  </defs>

  <!-- Anel + meia-lua -->
  <circle cx="526" cy="182" r="128" fill="none" stroke="url(#sacRing)" stroke-width="27" />
  <path d="M526 40a142 142 0 1 0 0 284" fill="none" stroke="#c9d3de" stroke-width="15"
        stroke-linecap="round" opacity=".95" />

  <!-- Glifo: headset (atendimento) -->
  <g transform="translate(526 182)">
    <path d="M-56 14v-12a56 56 0 0 1 112 0v12" fill="none" stroke="#1b3a5c"
          stroke-width="16" stroke-linecap="round" />
    <rect x="-74" y="8" width="32" height="56" rx="16" fill="#1b3a5c" />
    <rect x="42" y="8" width="32" height="56" rx="16" fill="#1b3a5c" />
    <path d="M58 64v6a22 22 0 0 1-22 22H16" fill="none" stroke="#1b3a5c"
          stroke-width="14" stroke-linecap="round" />
    <circle cx="2" cy="92" r="15" fill="#f2921e" />
  </g>

  <!-- Wordmark: sigla como kicker + nome por extenso em duas linhas -->
  <text x="526" y="404" text-anchor="middle" fill="#e07c0b"
        font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="14">SAC</text>

  <text x="526" y="510" text-anchor="middle" fill="#1b3a5c" stroke="#eef3f9" stroke-width="8" paint-order="stroke" stroke-linejoin="round"
        font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="700">Atendimento ao</text>

  <text x="526" y="622" text-anchor="middle" fill="#1b3a5c" stroke="#eef3f9" stroke-width="8" paint-order="stroke" stroke-linejoin="round"
        font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="108" font-weight="800" letter-spacing="1">Consumidor</text>

  <rect x="286" y="650" width="140" height="7" rx="3.5" fill="#e07c0b" />
  <rect x="627" y="650" width="140" height="7" rx="3.5" fill="#e07c0b" />
</svg>
